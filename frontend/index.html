<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas & Hábitos</title>
  <!-- Tailwind CSS vía CDN (sin paso de build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white text-slate-800">
  <div class="flex min-h-screen">

    <!-- Barra lateral -->
    <aside class="hidden md:flex md:flex-col w-72 bg-[#F1F4FA] p-6">
      <!-- Logo / nombre de la app -->
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold">F&H</div>
        <span class="text-lg font-bold">Finanzas & Hábitos</span>
      </div>

      <!-- Navegación -->
      <nav class="flex flex-col gap-2">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-full bg-[#DCE7FB] font-semibold">
          <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12l9-9 9 9M5 10v10h14V10" />
          </svg>
          Dashboard
        </a>
        <a href="#finanzas" class="flex items-center gap-3 px-4 py-3 rounded-full text-slate-600 hover:bg-[#DCE7FB]">
          <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="12" rx="2" /><circle cx="12" cy="12" r="2" />
          </svg>
          Finanzas
        </a>
        <a href="#habitos" class="flex items-center gap-3 px-4 py-3 rounded-full text-slate-600 hover:bg-[#DCE7FB]">
          <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M5 13l4 4L19 7" />
          </svg>
          Hábitos
        </a>
      </nav>

      <!-- Pie de la barra lateral -->
      <div class="mt-auto pt-6 border-t border-slate-200">
        <p class="text-xs text-slate-400">Proyecto UD1 · Control de Versiones</p>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="flex-1 p-6 md:p-10">

      <!-- Cabecera -->
      <header>
        <h1 class="text-3xl font-bold">Dashboard</h1>
        <p class="text-slate-500 mt-1">Hoy es <span id="fecha-hoy"></span></p>
      </header>

      <!-- Resumen -->
      <section class="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Tarjeta: Saldo -->
        <div class="rounded-3xl bg-[#EEF2FB] p-6">
          <p class="text-sm text-slate-500">Saldo</p>
          <p id="saldo-total" class="text-4xl font-bold mt-2">0,00 €</p>
        </div>

        <!-- Tarjeta: Ingresos -->
        <div class="rounded-3xl bg-[#EEF2FB] p-6 flex items-center gap-4">
          <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">
            <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </div>
          <div>
            <p class="text-sm text-slate-500">Ingresos</p>
            <p id="total-ingresos" class="text-2xl font-semibold text-emerald-600">0,00 €</p>
          </div>
        </div>

        <!-- Tarjeta: Gastos -->
        <div class="rounded-3xl bg-[#EEF2FB] p-6 flex items-center gap-4">
          <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center">
            <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12l7 7 7-7" />
            </svg>
          </div>
          <div>
            <p class="text-sm text-slate-500">Gastos</p>
            <p id="total-gastos" class="text-2xl font-semibold text-rose-500">0,00 €</p>
          </div>
        </div>
      </section>

      <!-- Hueco común -->
      <section id="contenido" class="grid grid-cols-1 xl:grid-cols-2 gap-6 mt-8">
        <!-- Bloque: Hábitos -->
        <article id="habitos" class="rounded-3xl bg-[#EEF2FB] p-6">
          <!-- Cabecera del bloque -->
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center">
              <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <h2 class="text-xl font-bold">Hábitos</h2>
          </div>

          <!-- Formulario: crear hábito -->
          <form id="form-habito" class="flex flex-col sm:flex-row gap-3">
            <input type="text" name="nombre" required placeholder="Nombre del hábito"
              class="flex-1 rounded-full bg-white px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" name="descripcion" placeholder="Descripción (opcional)"
              class="flex-1 rounded-full bg-white px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit"
              class="rounded-full bg-blue-600 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-700">
              Crear hábito
            </button>
          </form>
          <p id="error-habito" class="mt-2 min-h-5 text-sm text-rose-500"></p>

          <!-- Lista de hábitos (la rellena js/habitos.js) -->
          <ul id="lista-habitos" class="mt-4 flex flex-col gap-3"></ul>
        </article>
        <script type="module" src="js/habitos.js"></script>
      </section>

    </main>
  </div>
</body>
</html>
